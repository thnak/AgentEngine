# Layer map for tools/layering_lint.py (issue #120 S10).
#
# AgentEngineSpecification.md §3: "a layer may depend only on layers below it". Layers, low to high:
#
#   V     shared vocabulary. Every layer may include it; it may include only V and the std library.
#   L0    runtime substrate: agentengine::rt:: task/channel/mutex/pool/stores, PAL.
#   L1    trust & isolation: capability model, sandbox seam and backends, worktree, plugin ABI.
#   L2    agent core: Agent, AgentSession, tool plane, ChatClient plane, context providers, middleware.
#   L3    orchestration: workflows, multi-agent fan-out, projects, evaluation harness.
#   L4    protocol surfaces: MCP, A2A, AG-UI.
#   TEST  test support. Exempt as an includer; nothing outside TEST may include it.
#
# A file's layer comes from what the file IS (its banner, what it defines, the RFC/ADR it names),
# not from what it happens to include today. Directory defaults apply by longest matching prefix;
# a [files] entry overrides the default and must say why in one line. Every scanned file must end
# up with a layer, and every [files] entry must name a file that exists.

[directories]
"include/agentengine/core"     = { layer = "L2",   reason = "CONVENTIONS.md layout: core/ is the L2 agent core" }
"include/agentengine/rt"       = { layer = "L0",   reason = "agentengine::rt:: is the L0 substrate (spec §3); its L2/L3 residents are overridden below" }
"include/agentengine/pal"      = { layer = "L0",   reason = "platform abstraction (spec §3 L0: vendored socket PAL, ADR-037)" }
"include/agentengine/detail"   = { layer = "L0",   reason = "private low-level primitives (sha256)" }
"include/agentengine/trust"    = { layer = "L1",   reason = "CONVENTIONS.md layout: trust/ is L1" }
"include/agentengine/sandbox"  = { layer = "L1",   reason = "CONVENTIONS.md layout: sandbox/ is the L1 sandbox seam" }
"include/agentengine/plugin"   = { layer = "L1",   reason = "CONVENTIONS.md layout: plugin/ is the L1 WASM component host" }
"include/agentengine/tools"    = { layer = "L2",   reason = "built-in Tool<> conformers (009 §7) on the L2 tool plane" }
"include/agentengine/workflow" = { layer = "L3",   reason = "CONVENTIONS.md layout: workflow/ is L3 orchestration" }
"include/agentengine/eval"     = { layer = "L3",   reason = "evaluation harness (022, ADR-195) that drives whole agent sessions from above" }
"include/agentengine/protocol" = { layer = "L4",   reason = "CONVENTIONS.md layout: protocol/ is L4; provider clients are overridden below" }
"include/agentengine/testing"  = { layer = "TEST", reason = "test-only support" }
"src/core"                     = { layer = "L2",   reason = "translation units for include/agentengine/core (L2)" }
"src/rt"                       = { layer = "L0",   reason = "translation units for include/agentengine/rt (L0 by default)" }
"src/trust"                    = { layer = "L1",   reason = "translation units for include/agentengine/trust" }
"src/sandbox"                  = { layer = "L1",   reason = "translation units for include/agentengine/sandbox" }
"src/backends"                 = { layer = "L1",   reason = "sandbox backends (CONVENTIONS.md layout: src/backends)" }
"src/backends/vulkan_vector_index" = { layer = "L2", reason = "a VectorIndex conformer (ADR-180), part of the L2 retrieval plane, not a sandbox backend" }
"src/protocol"                 = { layer = "L2",   reason = "translation units for the L2 model-provider clients under include/agentengine/protocol (ADR-206)" }

