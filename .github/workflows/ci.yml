# Milestone 0 CI skeleton (docs/planning/milestone-0-bootstrap-breakdown.md task 2).
#
# Windows is the current Supported target (021-Platform-Support-and-Portability.md §2/§5): the
# {MSVC, clang-cl} x {Release, sanitizer} matrix below is that RFC's CI-matrix intent. MSVC has no
# UBSan, so its sanitizer leg is ASan-only; clang-cl's covers both, matching what 021 §5 actually
# asks for. The conformance suites and the budget gate 021 §5 also names aren't wired in here —
# nothing to run them against exists yet; they land with the RFCs that build that surface.
#
# Linux is "Next", not yet gated (021 §2) — its job here is intentionally narrower than the Windows
# matrix: a default (non-Python-runner), non-sanitized build-and-test pass, proving the M0 exit
# criterion ("builds clean on both platforms") without pretending Linux is Supported-tier yet. The
# full {gcc, clang} x {Release, ASan+UBSan+TSan} matrix (021 §5) is added when Linux implementation
# begins (roadmap Milestone 1+).
#
# Machine safety (CLAUDE.md, CONVENTIONS.md "Build & test — machine safety"): -j4 max everywhere,
# applies to CI configuration too (roadmap's own framing) — GitHub-hosted runners are 2-4 cores, so
# this caps at, not below, what's already available.

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-msvc:
    name: Windows / MSVC / ${{ matrix.build_type }}
    runs-on: windows-latest
    # Bounds a hang. Without this a stuck ctest runs to GitHub's 6-hour
    # default -- the MSVC ASan leg has done exactly that, reporting one
    # timeout and then sitting for an hour until a human cancelled it.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, ASan]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        shell: pwsh
        run: |
          $flags = ""
          if ("${{ matrix.build_type }}" -eq "ASan") { $flags = "/fsanitize=address" }
          cmake -S . -B build -DCMAKE_CXX_FLAGS="$flags"

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Test
        shell: pwsh
        run: |
          # MSVC's ASan links against clang_rt.asan_dynamic-x86_64.dll (it is a /MD-only feature),
          # and this job never enters a VS dev shell -- CMake finds the toolchain by itself for
          # Configure/Build, but the Test step inherits no MSVC PATH. So every ASan-instrumented
          # test binary failed to start with 0xC0000135 (DLL not found).
          #
          # That is why the ASan leg reported ZERO passes out of 169 while appearing to "hang":
          # a launch failure on the runner does not exit promptly the way it does locally, so ctest
          # sat waiting on processes that were never going to run. It was never a deadlock in the
          # examples -- example_04 only looked special because it is the one example carrying a
          # TIMEOUT property, so it was the only one CTest could cut off and report.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -property installationPath
            $dll = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter "clang_rt.asan_dynamic-x86_64.dll" -ErrorAction SilentlyContinue |
                   Where-Object { $_.DirectoryName -like '*Hostx64*x64*' } | Select-Object -First 1
            if ($dll) { $env:PATH = "$($dll.DirectoryName);$env:PATH"; Write-Host "ASan runtime: $($dll.DirectoryName)" }
            else { Write-Host "WARNING: clang_rt.asan_dynamic-x86_64.dll not found under $vs" }
          }
          ctest --test-dir build -C Release -j 4 --output-on-failure --timeout 180

  windows-clang-cl:
    name: Windows / clang-cl / ${{ matrix.build_type }}
    runs-on: windows-latest
    # Bounds a hang. Without this a stuck ctest runs to GitHub's 6-hour
    # default -- the MSVC ASan leg has done exactly that, reporting one
    # timeout and then sitting for an hour until a human cancelled it.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, ASanUBSan]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Not relying on VS2022's bundled ClangCL component — its version lags the 021 §5 floor
      # (clang 20+) often enough that pinning our own install is more predictable than hoping the
      # runner image caught up. AgentEngineCompilerGuard.cmake fails configure with a clear message
      # if this ever regresses below the floor, instead of a confusing mid-build error.
      - name: Install LLVM + Ninja
        run: |
          choco install llvm -y
          choco install ninja -y

      - name: Enter MSVC dev shell
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: pwsh
        run: |
          $env:CC = "clang-cl"
          $env:CXX = "clang-cl"
          $flags = ""
          if ("${{ matrix.build_type }}" -eq "ASanUBSan") { $flags = "-fsanitize=address,undefined" }
          # CMAKE_MSVC_RUNTIME_LIBRARY is pinned to the RELEASE dynamic CRT explicitly. CMake's
          # default for it is MultiThreaded$<$<CONFIG:Debug>:Debug>DLL, and that generator expression
          # evaluates to the DEBUG CRT (-MDd) inside the compiler-ABI try-compile, which runs before
          # CMAKE_BUILD_TYPE is in effect. clang-cl then rejects the combination outright --
          # "invalid argument '-MDd' not allowed with '-fsanitize=address'" -- so the ASanUBSan leg
          # died at "Detecting CXX compiler ABI info", before compiling a single project file.
          # The Release leg was unaffected only because it passes no sanitizer flag.
          # The sanitizer flag has to reach the LINKER as well, not just the compiler.
          # CMake drives Ninja + clang-cl through lld-link directly, which knows nothing about
          # -fsanitize, so pinning only CMAKE_CXX_FLAGS got past the CRT conflict and then failed
          # with "lld-link: error: undefined symbol: __asan_init" -- the instrumentation was
          # compiled in with no runtime to satisfy it.
          $linkflags = ""
          if ("${{ matrix.build_type }}" -eq "ASanUBSan") { $linkflags = "$flags" }
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -DCMAKE_CXX_FLAGS="$flags" `
            -DCMAKE_EXE_LINKER_FLAGS="$linkflags" -DCMAKE_SHARED_LINKER_FLAGS="$linkflags"

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        run: ctest --test-dir build -j 4 --output-on-failure --timeout 180

  windows-shell-fuzz:
    # 010 SS9 G8 / decisions/ADR-015-shellrunner-grammar-parser-fuzzing.md: continuous, corpus-driven
    # libFuzzer run against MediatedShellRunner's grammar parser under ASan+UBSan, gated in CI. A
    # separate job (not folded into windows-clang-cl above) because it needs a different CRT
    # (static, to match libFuzzer's own runtime lib -- see the ADR SS6) and builds only the one fuzz
    # target, not the whole test suite (AGENTENGINE_BUILD_TESTS=OFF).
    name: Windows / ShellRunner grammar-parser fuzz (G8, ADR-015)
    runs-on: windows-latest
    # Bounds a hang. Without this a stuck ctest runs to GitHub's 6-hour
    # default -- the MSVC ASan leg has done exactly that, reporting one
    # timeout and then sitting for an hour until a human cancelled it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM + Ninja
        run: |
          choco install llvm -y
          choco install ninja -y

      - name: Enter MSVC dev shell
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (ASan+UBSan, static CRT to match libFuzzer's runtime lib)
        shell: pwsh
        run: |
          cmake -S . -B build-fuzz -G Ninja `
            -DCMAKE_CXX_COMPILER=clang++ `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -D_DISABLE_STRING_ANNOTATION -D_DISABLE_VECTOR_ANNOTATION -g -O1" `
            -DAGENTENGINE_BUILD_SHELL_FUZZER=ON `
            -DAGENTENGINE_BUILD_TESTS=OFF

      - name: Build fuzz target
        run: cmake --build build-fuzz --target agentengine_mediated_shell_parser_fuzz -j 4

      - name: Run declared-minimum corpus-driven fuzz pass (120s, single-process -- CLAUDE.md machine safety)
        shell: pwsh
        run: |
          $rt = $(clang++ -print-resource-dir)
          $env:PATH = "$rt\lib\windows;$env:PATH"
          $env:ASAN_OPTIONS = "detect_leaks=0:halt_on_error=1"
          $env:UBSAN_OPTIONS = "halt_on_error=1:print_stacktrace=1"
          New-Item -ItemType Directory -Force -Path build-fuzz\ci_corpus | Out-Null
          Copy-Item tests\fuzz\corpus\mediated_shell_parser\* build-fuzz\ci_corpus\
          & build-fuzz\agentengine_mediated_shell_parser_fuzz.exe -max_total_time=120 -print_final_stats=1 build-fuzz\ci_corpus
          if ($LASTEXITCODE -ne 0) { throw "libFuzzer found a crash/hang/OOB read -- see the log above" }

  linux:
    name: Linux / gcc-14 / Release (build-only — see file header)
    runs-on: ubuntu-latest
    # Bounds a hang. Without this a stuck ctest runs to GitHub's 6-hour
    # default -- the MSVC ASan leg has done exactly that, reporting one
    # timeout and then sitting for an hour until a human cancelled it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # llvm-nm: test_shell_runner_no_process_creation degrades to CTest SKIP without it (see
      # tests/CMakeLists.txt), but installing it gives that test's actual signal on this platform
      # instead of a shrug.
      - name: Install gcc-14, llvm-nm
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 llvm

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14

      - name: Build
        run: cmake --build build -j 4

      - name: Test
        run: ctest --test-dir build -j 4 --output-on-failure --timeout 180

  naming-lint:
    name: 027 naming lint (stub)
    runs-on: ubuntu-latest
    # Bounds a hang. Without this a stuck ctest runs to GitHub's 6-hour
    # default -- the MSVC ASan leg has done exactly that, reporting one
    # timeout and then sitting for an hour until a human cancelled it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run naming lint
        run: python tools/naming_lint.py

  milestone-status-lint:
    name: Milestone-status drift lint (ADR-026)
    runs-on: ubuntu-latest
    # Bounds a hang. Without this a stuck ctest runs to GitHub's 6-hour
    # default -- the MSVC ASan leg has done exactly that, reporting one
    # timeout and then sitting for an hour until a human cancelled it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run milestone-status lint
        run: python tools/milestone_status_lint.py
