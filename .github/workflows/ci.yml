# Milestone 0 CI skeleton (docs/planning/milestone-0-bootstrap-breakdown.md task 2).
#
# Windows is the current Supported target (021-Platform-Support-and-Portability.md §2/§5): the
# {MSVC, clang-cl} x {Release, sanitizer} matrix below is that RFC's CI-matrix intent. MSVC has no
# UBSan, so its sanitizer leg is ASan-only; clang-cl's covers both, matching what 021 §5 actually
# asks for. The conformance suites and the budget gate 021 §5 also names aren't wired in here —
# nothing to run them against exists yet; they land with the RFCs that build that surface.
#
# Linux is "Next", not yet gated (021 §2) — its job here is intentionally narrower than the Windows
# matrix: a default (non-Python-runner), non-sanitized build-and-test pass, proving the M0 exit
# criterion ("builds clean on both platforms") without pretending Linux is Supported-tier yet. The
# full {gcc, clang} x {Release, ASan+UBSan+TSan} matrix (021 §5) is added when Linux implementation
# begins (roadmap Milestone 1+).
#
# Machine safety (CLAUDE.md, CONVENTIONS.md "Build & test — machine safety"): -j4 max everywhere,
# applies to CI configuration too (roadmap's own framing) — GitHub-hosted runners are 2-4 cores, so
# this caps at, not below, what's already available.
#
# sccache (every build job below, 2026-09-04): every run before this was a full from-scratch build
# of ~190 targets with no compiler cache at all. `mozilla-actions/sccache-action` installs the
# sccache binary and, via SCCACHE_GHA_ENABLED below, backs its object cache with the GitHub Actions
# cache service directly -- no separate actions/cache save/restore steps or cache-key management
# needed, sccache's own content hashing decides hit/miss per translation unit. Wired as
# CMAKE_C_COMPILER_LAUNCHER/CMAKE_CXX_COMPILER_LAUNCHER on every Configure step below. The
# windows-msvc job's ASan leg also switches /Zi -> /Z7 (see that job's own Configure comment):
# sccache cannot reliably cache MSVC's /Zi output (a shared, incrementally-written .pdb is not a
# pure function of one TU's inputs), and /Z7 needs neither that shared .pdb nor the /FS flag that
# used to serialize writes to it.

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned deliberately, and pinned to >= 22.1 deliberately.
  # docs/research/2026-08-16-clang-windows-asan-exception-ptr.md: clang's
  # AddressSanitizer on Windows corrupts catch-block parameters (google/sanitizers#749),
  # mitigated by llvm/llvm-project#159618 which first shipped in LLVM 22.1.0. On clang 20.1.8 --
  # what these jobs silently used before this pin -- the ASanUBSan leg cannot run any program that
  # catches an exception and calls what(). Measured clean on 22.1.8 across static/DLL CRT and
  # ASan/ASan+UBSan.
  AE_LLVM_VERSION: 22.1.8
  # C/C++ path (README, mozilla-actions/sccache-action): sccache backs its cache with the GitHub
  # Actions cache service when this is set, instead of a local-disk cache that would need its own
  # actions/cache save/restore steps.
  SCCACHE_GHA_ENABLED: "true"

jobs:
  windows-msvc:
    name: Windows / MSVC / ${{ matrix.build_type }}
    runs-on: windows-latest
    # Bounds a hang. Without this a stuck ctest runs to GitHub's 6-hour
    # default -- the MSVC ASan leg has done exactly that, reporting one
    # timeout and then sitting for an hour until a human cancelled it.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, ASan]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Ninja (below) doesn't auto-locate the VS toolchain the way the default VS-generator
      # Configure used to -- it needs cl.exe and INCLUDE/LIB on PATH, which is what this provides.
      - name: Enter MSVC dev shell
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure
        shell: pwsh
        run: |
          $flags = ""
          # /Z7 (debug info embedded in each .obj) is required alongside /fsanitize=address --
          # without SOME debug-info format MSVC raises C5072 ("ASAN enabled without debug
          # information emission"), which agentengine_warnings' /WX (cmake/AgentEngineWarnings.cmake)
          # promotes to a hard build failure across every TU. /Z7, not /Zi: sccache can't reliably
          # cache /Zi's output (a shared, incrementally-written .pdb is not a pure function of one
          # TU's inputs -- see the file-header sccache note), and /Z7 needs neither that shared .pdb
          # nor the /FS flag that used to serialize writes to it under the old MSBuild generator.
          if ("${{ matrix.build_type }}" -eq "ASan") { $flags = "/fsanitize=address /Z7" }
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="$flags" `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build -j 4

      - name: sccache stats
        if: always()
        shell: pwsh
        run: "& $env:SCCACHE_PATH --show-stats"

      - name: Test
        shell: pwsh
        run: |
          # MSVC's ASan links against clang_rt.asan_dynamic-x86_64.dll (it is a /MD-only feature).
          # This job now enters a VS dev shell before Configure (2026-09-04, needed for the Ninja
          # generator to find cl.exe at all), which already puts that DLL's directory on PATH for
          # every later step including this one -- but the lookup below is kept as a harmless,
          # explicit belt-and-suspenders: BEFORE that dev-shell step existed, the job never entered
          # one (CMake's old default VS-generator Configure found the toolchain by itself without
          # needing PATH, but the Test step inherited none of it), so every ASan-instrumented test
          # binary failed to start with 0xC0000135 (DLL not found).
          #
          # That is why the ASan leg reported ZERO passes out of 169 while appearing to "hang":
          # a launch failure on the runner does not exit promptly the way it does locally, so ctest
          # sat waiting on processes that were never going to run. It was never a deadlock in the
          # examples -- example_04 only looked special because it is the one example carrying a
          # TIMEOUT property, so it was the only one CTest could cut off and report.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -property installationPath
            $dll = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter "clang_rt.asan_dynamic-x86_64.dll" -ErrorAction SilentlyContinue |
                   Where-Object { $_.DirectoryName -like '*Hostx64*x64*' } | Select-Object -First 1
            if ($dll) { $env:PATH = "$($dll.DirectoryName);$env:PATH"; Write-Host "ASan runtime: $($dll.DirectoryName)" }
            else { Write-Host "WARNING: clang_rt.asan_dynamic-x86_64.dll not found under $vs" }
          }
          # ADR-146 §12: excludes the real-Docker-daemon tests -- confirmed (2026-08-31, same
          # failure present on this branch's own tip BEFORE this ADR's own work started, so not a
          # regression) that `windows-latest` GitHub-hosted runners have no Docker daemon at all
          # ("failed to connect to the docker API at npipe:////./pipe/docker_engine ... The system
          # cannot find the file specified"). Unlike the Linux job's containerd gap (§1, fixable with
          # `sudo`), there is no daemon here to grant access to -- GitHub-hosted Windows runners don't
          # ship one, matching this project's own "Linux is the live-daemon CI tier, Windows is
          # Supported for build/test but not for a live Docker daemon" posture (kata-backend-ci.yml's
          # own self-hosted-only precedent is the same class of decision). Local developer verification
          # against a real Windows Docker Desktop daemon (this session's own established discipline)
          # is unaffected -- this exclusion is CI-only.
          # test_docker_run_argv_timeout/test_docker_non_ascii_path added 2026-09-04: both carry the
          # same `RESOURCE_LOCK docker_daemon` / "REQUIRES a running Docker daemon" posture as the
          # other six (tests/CMakeLists.txt) but were left off this list when they were added, so CI
          # ran them against the same nonexistent daemon and failed every Windows leg.
          # No -C Release: Ninja (switched to above, 2026-09-04) is single-config, unlike the old
          # default VS-generator build this flag used to select a config out of.
          ctest --test-dir build -j 4 --output-on-failure --timeout 180 `
            -E '^(test_composed_sandbox_providers_live|test_sandbox_runtime|test_docker_orphan_reap|test_mandatory_sandbox_provider|test_task_branch_tools|test_task_branch_concurrent_dispatch|test_docker_run_argv_timeout|test_docker_non_ascii_path)$'

  windows-clang-cl:
    name: Windows / clang-cl / ${{ matrix.build_type }}
    runs-on: windows-latest
    # Bounds a hang. Without this a stuck ctest runs to GitHub's 6-hour
    # default -- the MSVC ASan leg has done exactly that, reporting one
    # timeout and then sitting for an hour until a human cancelled it.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, ASanUBSan]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Not relying on VS2022's bundled ClangCL component — its version lags the 021 §5 floor
      # (clang 20+) often enough that pinning our own install is more predictable than hoping the
      # runner image caught up. AgentEngineCompilerGuard.cmake fails configure with a clear message
      # if this ever regresses below the floor, instead of a confusing mid-build error.
      # `choco install llvm -y` was NOT a pin, despite the comment above having claimed one for as
      # long as it existed: choco no-ops when the package is already present, and the windows-latest
      # image ships LLVM. These jobs therefore ran whatever the image happened to carry -- clang
      # 20.1.8 as of 2026-08-16 -- with nobody choosing it, which is how the ASan defect went
      # unnoticed. Installing LLVM's own release asset at a pinned version is an actual pin.
      - name: Install LLVM ${{ env.AE_LLVM_VERSION }} (pinned) + Ninja
        shell: pwsh
        run: |
          choco install ninja -y
          $v = "${{ env.AE_LLVM_VERSION }}"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$v/LLVM-$v-win64.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\llvm.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\llvm.exe" -ArgumentList '/S' -Wait
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify the pinned clang is what we got
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\LLVM\bin;$env:PATH"
          $ver = (clang++ --version | Select-Object -First 1)
          Write-Host $ver
          if ($ver -notmatch 'clang version (\d+)\.') { throw "cannot parse clang version from '$ver'" }
          # 021 §5 floor is clang 20+; the research note above raises the effective floor to 22 on Windows,
          # because below it the sanitizer leg cannot execute exception-handling code at all.
          if ([int]$Matches[1] -lt 22) { throw "clang $($Matches[1]) predates llvm/llvm-project#159618 -- see docs/research/2026-08-16-clang-windows-asan-exception-ptr.md" }

      - name: Enter MSVC dev shell
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure
        shell: pwsh
        run: |
          $env:CC = "clang-cl"
          $env:CXX = "clang-cl"
          # The two legs of this matrix need genuinely different link setups, so they are
          # configured separately rather than through one command with a flag variable.
          #
          # Release keeps the clang-cl frontend, which is the point of this job: MSVC-compatible
          # parsing of the whole codebase.
          #
          # ASanUBSan cannot use clang-cl here. CMake drives Ninja + clang-cl through lld-link, and
          # lld-link does not understand -fsanitize -- it says so directly ("ignoring unknown
          # argument '-fsanitize=address,undefined'") and then fails with "undefined symbol:
          # __asan_init", because the instrumentation is compiled in with no runtime linked. Passing
          # the flag through CMAKE_EXE_LINKER_FLAGS does not help for the same reason: it reaches
          # lld-link, which ignores it again.
          #
          # So the sanitizer leg uses the clang++ DRIVER with the static CRT -- exactly the recipe
          # the ShellRunner fuzz job in this same workflow already uses successfully on this same
          # runner image. The driver understands -fsanitize and links the ASan/UBSan runtimes
          # itself. Stated plainly: this narrows what the leg exercises from the clang-cl frontend
          # to the clang++ one. That is a real reduction, accepted because the Release leg above
          # still covers clang-cl parsing, and a sanitizer job that cannot link covers nothing.
          if ("${{ matrix.build_type }}" -eq "ASanUBSan") {
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo `
              -DCMAKE_CXX_COMPILER=clang++ `
              -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
              -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -D_DISABLE_STRING_ANNOTATION -D_DISABLE_VECTOR_ANNOTATION -g -O1" `
              -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          } else {
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
              -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
              -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          }

      - name: Build
        run: cmake --build build -j 4

      - name: sccache stats
        if: always()
        shell: pwsh
        run: "& $env:SCCACHE_PATH --show-stats"

      # The ASanUBSan leg needs clang's sanitizer runtime DLLs on PATH before ctest launches
      # anything. Without them nothing runs: EVERY test in this job timed out at its full limit
      # having produced ZERO output -- 0 passed, 41 timed out before the job cap killed it, and that
      # included example_01_hello_agent, which cannot fail on its own merits. A binary whose DLL is
      # missing never reaches main, and on a headless runner it stalls instead of reporting, so the
      # signature is a hang rather than an error. This is the same defect, and the same fix, as the
      # MSVC ASan job's own vswhere PATH step earlier in this file.
      #
      # `clang++ -print-resource-dir` is exactly how the ShellRunner fuzz job below -- same compiler,
      # same -fsanitize flags, same static CRT, and passing -- locates them. Harmless on the Release
      # leg, which links no sanitizer runtime, so this is not conditionalized.
      #
      # ASAN_OPTIONS/UBSAN_OPTIONS also mirror that job: LeakSanitizer has no Windows
      # implementation, so detect_leaks=0 states that rather than leaving it to fail obscurely, and
      # halt_on_error keeps a sanitizer finding a hard failure instead of a warning in a log.
      - name: Test
        shell: pwsh
        run: |
          $rt = $(clang++ -print-resource-dir)
          $env:PATH = "$rt\lib\windows;$env:PATH"
          Write-Host "clang sanitizer runtime dir: $rt\lib\windows"
          $env:ASAN_OPTIONS = "detect_leaks=0:halt_on_error=1"
          $env:UBSAN_OPTIONS = "halt_on_error=1:print_stacktrace=1"
          # ADR-146 §12: see the windows-msvc job's own Test step comment above -- same exclusion,
          # same reason (no Docker daemon on GitHub-hosted windows-latest runners), applied here too.
          ctest --test-dir build -j 4 --output-on-failure --timeout 180 `
            -E '^(test_composed_sandbox_providers_live|test_sandbox_runtime|test_docker_orphan_reap|test_mandatory_sandbox_provider|test_task_branch_tools|test_task_branch_concurrent_dispatch|test_docker_run_argv_timeout|test_docker_non_ascii_path)$'
          # Explicit, not incidental: this step became a pwsh block to set PATH, and a shell block
          # that ends on a native command must still surface that command's exit code. Stated here
          # rather than relying on the runner appending it, so a failing ctest can never read green.
          if ($LASTEXITCODE -ne 0) { throw "ctest failed with exit code $LASTEXITCODE" }

  windows-shell-fuzz:
    # 010 SS9 G8 / decisions/ADR-015-shellrunner-grammar-parser-fuzzing.md: continuous, corpus-driven
    # libFuzzer run against MediatedShellRunner's grammar parser under ASan+UBSan, gated in CI. A
    # separate job (not folded into windows-clang-cl above) because it needs a different CRT
    # (static, to match libFuzzer's own runtime lib -- see the ADR SS6) and builds only the one fuzz
    # target, not the whole test suite (AGENTENGINE_BUILD_TESTS=OFF).
    name: Windows / ShellRunner grammar-parser fuzz (G8, ADR-015)
    runs-on: windows-latest
    # Bounds a hang. Without this a stuck ctest runs to GitHub's 6-hour
    # default -- the MSVC ASan leg has done exactly that, reporting one
    # timeout and then sitting for an hour until a human cancelled it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # `choco install llvm -y` was NOT a pin, despite the comment above having claimed one for as
      # long as it existed: choco no-ops when the package is already present, and the windows-latest
      # image ships LLVM. These jobs therefore ran whatever the image happened to carry -- clang
      # 20.1.8 as of 2026-08-16 -- with nobody choosing it, which is how the ASan defect went
      # unnoticed. Installing LLVM's own release asset at a pinned version is an actual pin.
      - name: Install LLVM ${{ env.AE_LLVM_VERSION }} (pinned) + Ninja
        shell: pwsh
        run: |
          choco install ninja -y
          $v = "${{ env.AE_LLVM_VERSION }}"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$v/LLVM-$v-win64.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\llvm.exe"
          Start-Process -FilePath "$env:RUNNER_TEMP\llvm.exe" -ArgumentList '/S' -Wait
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify the pinned clang is what we got
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\LLVM\bin;$env:PATH"
          $ver = (clang++ --version | Select-Object -First 1)
          Write-Host $ver
          if ($ver -notmatch 'clang version (\d+)\.') { throw "cannot parse clang version from '$ver'" }
          # 021 §5 floor is clang 20+; the research note above raises the effective floor to 22 on Windows,
          # because below it the sanitizer leg cannot execute exception-handling code at all.
          if ([int]$Matches[1] -lt 22) { throw "clang $($Matches[1]) predates llvm/llvm-project#159618 -- see docs/research/2026-08-16-clang-windows-asan-exception-ptr.md" }

      - name: Enter MSVC dev shell
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure (ASan+UBSan, static CRT to match libFuzzer's runtime lib)
        shell: pwsh
        run: |
          cmake -S . -B build-fuzz -G Ninja `
            -DCMAKE_CXX_COMPILER=clang++ `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined -D_DISABLE_STRING_ANNOTATION -D_DISABLE_VECTOR_ANNOTATION -g -O1" `
            -DAGENTENGINE_BUILD_SHELL_FUZZER=ON `
            -DAGENTENGINE_BUILD_TESTS=OFF `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build fuzz target
        run: cmake --build build-fuzz --target agentengine_mediated_shell_parser_fuzz -j 4

      - name: sccache stats
        if: always()
        shell: pwsh
        run: "& $env:SCCACHE_PATH --show-stats"

      - name: Run declared-minimum corpus-driven fuzz pass (120s, single-process -- CLAUDE.md machine safety)
        shell: pwsh
        run: |
          $rt = $(clang++ -print-resource-dir)
          $env:PATH = "$rt\lib\windows;$env:PATH"
          $env:ASAN_OPTIONS = "detect_leaks=0:halt_on_error=1"
          $env:UBSAN_OPTIONS = "halt_on_error=1:print_stacktrace=1"
          New-Item -ItemType Directory -Force -Path build-fuzz\ci_corpus | Out-Null
          Copy-Item tests\fuzz\corpus\mediated_shell_parser\* build-fuzz\ci_corpus\
          & build-fuzz\agentengine_mediated_shell_parser_fuzz.exe -max_total_time=120 -print_final_stats=1 build-fuzz\ci_corpus
          if ($LASTEXITCODE -ne 0) { throw "libFuzzer found a crash/hang/OOB read -- see the log above" }

  linux:
    name: Linux / gcc-14 / Release (build-only — see file header)
    runs-on: ubuntu-latest
    # Bounds a hang. Without this a stuck ctest runs to GitHub's 6-hour
    # default -- the MSVC ASan leg has done exactly that, reporting one
    # timeout and then sitting for an hour until a human cancelled it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # llvm-nm: test_shell_runner_no_process_creation degrades to CTest SKIP without it (see
      # tests/CMakeLists.txt), but installing it gives that test's actual signal on this platform
      # instead of a shrug.
      - name: Install gcc-14, llvm-nm
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 llvm

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build
        run: cmake --build build -j 4

      - name: sccache stats
        if: always()
        run: "$SCCACHE_PATH --show-stats"

      # test_containerd_execution_surface / test_composed_containerd_providers_live talk to
      # /run/containerd/containerd.sock directly via the raw `ctr` CLI. Unlike the Docker socket
      # (already runner-user-accessible on ubuntu-latest, see test_docker_orphan_reap passing
      # unprivileged), containerd's socket is root-only by default and was never granted equivalent
      # access -- ADR-145 (ex-ADR-106)'s own text already said "Run as root (containerd's default
      # socket permissions require it)" when this suite was first verified; it just never had a CI
      # leg to run on until this branch. Root is scoped to ONLY these two tests, not the whole
      # suite: several tests (the escape-corpus permission-denial suites) specifically assert a
      # POSIX permission check REJECTS an operation, which root bypasses -- running everything as
      # root would silently flip that signal.
      - name: Test
        run: |
          ctest --test-dir build -j 4 --output-on-failure --timeout 180 \
            -E '^(test_containerd_execution_surface|test_composed_containerd_providers_live)$'

      # `if: always()`: a GitHub Actions step only runs if every prior step in the job succeeded,
      # by default -- without this, an unrelated failure in the step above (any of the ~185 other
      # tests) would silently SKIP this step entirely rather than fail it, leaving the containerd
      # fix this ADR exists for completely unexercised while the job still correctly shows red for
      # the unrelated reason. `always()` runs it unconditionally; the job's own overall result still
      # reflects a failure here exactly as it would without this line, since a failed step fails the
      # job regardless of which other steps ran.
      # The permission fix alone surfaced a second, real gap on this runner (found from an actual CI
      # run, not assumed): `ctr run` failed with `image "docker.io/library/alpine:latest": not
      # found`, even though `docker` (see the unprivileged Test step above) pulls that exact image
      # fine. `docker` and `ctr` don't share an image store here -- ubuntu-latest's Docker uses its
      # own containerd namespace (`moby`), distinct from the `default` namespace plain `ctr` targets
      # -- so a `docker pull` is invisible to `ctr run`. Pre-pulling explicitly through `ctr` itself
      # closes the gap regardless of which of those two explanations is the exact mechanism.
      - name: Pull containerd test image
        if: always()
        run: sudo ctr image pull docker.io/library/alpine:latest

      - name: Test (containerd, root)
        if: always()
        run: |
          sudo ctest --test-dir build -j 4 --output-on-failure --timeout 180 \
            -R '^(test_containerd_execution_surface|test_composed_containerd_providers_live)$'

  naming-lint:
    name: 027 naming lint (stub)
    runs-on: ubuntu-latest
    # Bounds a hang. Without this a stuck ctest runs to GitHub's 6-hour
    # default -- the MSVC ASan leg has done exactly that, reporting one
    # timeout and then sitting for an hour until a human cancelled it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run naming lint
        run: python tools/naming_lint.py

  milestone-status-lint:
    name: Milestone-status drift lint (ADR-026)
    runs-on: ubuntu-latest
    # Bounds a hang. Without this a stuck ctest runs to GitHub's 6-hour
    # default -- the MSVC ASan leg has done exactly that, reporting one
    # timeout and then sitting for an hour until a human cancelled it.
    timeout-minutes: 45
