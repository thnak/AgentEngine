name: Cache watch

# Daily upkeep of the Actions cache (tools/ci_cache_watch.sh): deletes leaked PR entries and outdated ones. What it
# cannot fix fails the run, and GitHub emails the repo owner about a failed scheduled workflow (no separate alerting).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  pull-requests: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # `bash`, not the bare path: the script was committed from Windows without the exec bit, and every
      # scheduled run until 2026-10-20 died with exit 126 (Permission denied) before checking anything.
      - run: bash tools/ci_cache_watch.sh
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
